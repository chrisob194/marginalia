<label [for]="id()" class="block text-sm font-medium text-gray-700">{{ label() }}</label>
<input [type]="type()" [formField]="formField()" [id]="id()" [attr.aria-invalid]="ariaInvalid()"
  [attr.aria-describedby]="ariaDescribedBy()" [autocomplete]="autocomplete()"
  class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-gray-900 shadow-sm focus:border-blue-500 focus:outline focus:outline-blue-500 sm:text-sm" />
<p role="alert" [id]="errorMessageId()" class="mt-1 text-sm text-red-600">{{ errorMessage() }}</p>
@if (hint()) {
<p [id]="hintMessageId()" class="mt-1 text-xs text-gray-500">{{ hint() }}</p>
}
