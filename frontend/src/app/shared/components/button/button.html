<button [type]="type()" [disabled]="disabled()"
  [class.cursor-not-allowed]="disabled()"
  [class.opacity-50]="disabled()"
  [class.hover:bg-blue-700]="!disabled()"
  class="flex w-full items-center justify-center rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-blue-700 focus:outline focus:outline-offset-2 focus:outline-blue-600">
  {{ label() }}
</button>
